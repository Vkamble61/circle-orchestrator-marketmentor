ingestion_task:
  agent: ingestion_agent

  description: >
    Step 1: Use Extraction_Tool() exactly ONCE with no parameters.
    Step 2: Accept whatever result the tool returns without modification.
    Step 3: Provide that result as your final answer and STOP immediately.
    DO NOT call the tool again. DO NOT validate results.
    NO additional processing. NO validation. NO formatting. NO thinking.

  expected_output: >
    The exact output returned by Extraction_Tool, which will be a summary like:
    "Processed X PDFs: file1.pdf -> extracted_output/file1.txt, file2.pdf -> extracted_output/file2.txt"
    
indexing_task:
  agent: indexing_agent

  description: >
    Step 1: Use Indexing_Tool() exactly ONCE with empty path parameter: Indexing_Tool(path="")
    Step 2: Accept whatever result the tool returns without modification.
    Step 3: Provide that result as your final answer and STOP immediately.
    DO NOT call the tool again. DO NOT validate results. DO NOT process further.

  expected_output: >
    The exact output returned by Indexing_Tool, which will be a confirmation like:
    "Successfully indexed X files with Y chunks. Files: [list]"


retrieval_task:
  agent: retrieval_agent

  description: >  
    Step 1: Use Retrieval_Tool() exactly ONCE with the user's question: Retrieval_Tool(question="user's question")
    Step 2: Accept whatever documents the tool retrieves without modification.
    Step 3: Synthesize the retrieved information into a comprehensive answer and STOP immediately.
    DO NOT call the tool again. DO NOT search multiple times. DO NOT validate results.

  expected_output: >
    A comprehensive answer based on the retrieved documents, including specific examples and details.
    Format: "Based on the knowledge base: [answer with specific details from retrieved documents]"
  
marketing_task:
  agent: marketing_agent

  description: >  
    Using the retrieval results, provide creative, concise and relevant answers to user queries based on similarity search results.
 
  expected_output: >
    A detailed marketing strategy or campaign plan based on retrieval task output, the provided information, and market analysis.